<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale1.0">
        <link rel="stylesheet" href="style.css">
        <title>Minha Biblioteca</title>
    </head>
    <body>
        <div class="container">
            <header class="cabecalho">
                <h1>Biblioteca</h1>
        <p>Titulo e subtitulo</p>
            </header>
       <nav class="menu">
         <h2>Menu de navegacao</h2>
         <div class="links-menu">
            <a href="inicio">Inicio</a>
            <a href="livros">Livros</a>
            <a href="usuarios">Usuarios</a>
            <a href="contato">Contato</a>
        </div>
        </nav>
        <main class="conteudo">
            <section class="livros">
        <h2>Livros disponiveis</h2>
        <ul>
            <li>O pequeno principe</li>
            <li>Anna frank</li>
            <li>Dom quixote</li>
            <li>Dom casmurro</li>
            <li>Vidas secas</li>
        </ul>
        </section>
        <section class="cadastro">
        <h2>Cadastro de livro</h2>
        <form>
            <label for="titulo">Titulo:</label>
            <input type="text" size="40" id="titulo" name="titulo">
            <label for="autor">Autor:</label>
            <input type="text" size="40" id="autor" name="autor">
            <label for="ano">Ano:</label>
            <input type="text" size="40" id="ano " name="ano">
            <button type="submit">
                Cadastrar
            </button>
        </section>
        </form>
        </main>
        <footer class="rodape">
        <h2>rodape</h2>    
        <p>© Projeto de desenvolvimento web - 2026</p>
        </footer>
        </div>
    </body>
</html>
